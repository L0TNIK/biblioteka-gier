services:
  db:
    image: postgres:16-alpine
    container_name: biblioteka_gier_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: haslo_do_bazy
      POSTGRES_DB: biblioteka_gier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: biblioteka_gier_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Nadpisujemy adres bazy wewnątrz sieci Dockera (host to 'db', a nie 'localhost')
      DATABASE_URL: postgresql+psycopg://postgres:haslo_do_bazy@db:5432/biblioteka_gier
    depends_on:
      db:
        condition: service_healthy

  frontend:
      image: nginx:alpine
      container_name: biblioteka_gier_frontend
      restart: always
      ports:
        - "80:80"
      volumes:
        - .:/usr/share/nginx/html:ro
      depends_on:
        - backend

volumes:
  postgres_data: