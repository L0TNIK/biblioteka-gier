
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestrowanie</title>
    <link rel="stylesheet" href="styl-rejestracja.css">
</head>
<body>

    <main class="strona">

        

        <section class="panel">

            <div class="formularz">

                <h1>REJESTRACJA</h1>

                <form>
                    <label for="login">Nazwa Użytkownika</label>
                    <input type="text" id="login" name="login">

                    <label for="email">Email</label>
                    <input type="text" id="email" name="email">

                    <label for="haslo">Hasło</label>
                    <input type="password" id="haslo" name="haslo">

                    <label for="powtorzHaslo">Hasło</label>
                    <input type="password" id="powtorzHaslo" name="powtorzHaslo">

                    <button type="submit">Utwórz konto</button>
                </form>

                
            </div>

        </section>

        <footer>
            <p>Masz juz konto?</p>
            <a href="#" class="rejestracja">Zaloguj sie</a>
        </footer>

    </main>

</body>
</html>
