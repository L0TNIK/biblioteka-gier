<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteka gier</title>
    <link rel="stylesheet" href="styl-glownej.css">
</head>
<script src="app.js" defer></script>
<body>
    <div class="app">  
        <header class="topbar">
            <div class="search-area">
                <select id="sort">
                    <option value="asc">alfabetycznie (A-Z)</option>
                    <option value="desc">alfabetycznie (Z-A)</option>
                </select>

                <input
                    type="text"
                    id="search"
                    placeholder="wyszukaj grę"
                >

                <button class="search-button" id="search-button"> </button>
            </div>

            <div class="profile">
                <img src="zdjecia/profilowe.png" alt="Profil użytkownika">
            </div>
        </header>
        <main class="games-container" id="games-list">

        </main>
                <footer class="bottom-bar">
            <button class="add-game" id="open-add-game">
                <span>⊕</span> Dodaj grę
            </button>
        </footer>

        <div id="add-game-modal" class="modal" hidden>
            <div class="modal-content">
                <h2>Nazwa gry</h2>

                <div class="modal-search">
                    <input type="text" id="game-name" placeholder="Wpisz nazwę gry">
                    <button id="search-steam">🔍</button>
                </div>

                <div id="steam-results"></div>
                <input type="number" id="game-rating" min="1" max="10" placeholder="Twoja ocena (1-10), opcjonalnie">

                <button id="confirm-add-game">Dodaj grę</button>
                <button id="cancel-add-game">Anuluj</button>
            </div>
        </div>

            <div id="edit-game-modal" class="modal" hidden>
                <div class="modal-content">
                    <h2>Edytuj grę</h2>


                    <button id="cancel-edit-game">Anuluj</button>
                </div>
            </div>


            <div id="delete-game-modal" class="modal" hidden>
                <div class="modal-content">
                    <h2>Czy na pewno chcesz usunąć tę grę?</h2>

                    <button id="confirm-delete-game">Tak</button>
                    <button id="cancel-delete-game">Anuluj</button>
                </div>
            </div>

    </div>
</body>
</html>
