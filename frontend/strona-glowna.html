<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteka gier</title>
    <link rel="stylesheet" href="styl-glownej.css">
</head>
<script src="app.js" defer></script>
<body>
    <div class="app">  
        <header class="topbar">
            <div class="search-area">
                <select id="sort">
                    <option value="asc">alfabetycznie (A-Z)</option>
                    <option value="desc">alfabetycznie (Z-A)</option>
                </select>

                <input
                    type="text"
                    id="search"
                    placeholder="wyszukaj grę"
                >

                <button class="search-button" id="search-button"> </button>
            </div>

            <div class="profile">
                <img src="zdjecia/profilowe.png" alt="Profil użytkownika">
            </div>
        </header>
        <main class="games-container" id="games-list">

        </main>
        <footer class="bottom-bar">
            <button class="add-game">
                <span>⊕</span> Dodaj grę
            </button>
        </footer>
    </div>
</body>
</html>
