
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteka gier</title>
    <link rel="stylesheet" href="styl-glownej.css">
    <script src="app.js" defer></script>
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="search-area">
                <select id="sort">
                    <option value="asc">alfabetycznie (A-Z)</option>
                    <option value="desc">alfabetycznie (Z-A)</option>
                </select>

                <select id="genre-filter">
                    <option value="">Wszystkie gatunki</option>
                    <option value="ulubione">⭐ Ulubione</option>
                    <option value="Akcja">Akcja</option>
                    <option value="Przygodowe">Przygodowe</option>
                    <option value="RPG">RPG</option>
                    <option value="MMORPG">MMORPG</option>
                    <option value="Soulslike">Soulslike</option>
                    <option value="FPS">Strzelanki (FPS)</option>
                    <option value="TPS">Strzelanki (TPS)</option>
                    <option value="Strategie">Strategie</option>
                    <option value="Symulacje">Symulacje</option>
                    <option value="Wyścigowe">Wyścigowe</option>
                    <option value="Sportowe">Sportowe</option>
                    <option value="Horror">Horror</option>
                </select>

                <input type="text" id="search" placeholder="wyszukaj grę">

                <button class="search-button" id="search-button"></button>
            </div>

            <div class="profile">
                <button class="profile-button" id="profile-button" aria-expanded="false">
                    <img src="zdjecia/profilowe.png" alt="Profil użytkownika">
                </button>

                <div class="profile-menu" id="profile-menu" hidden>
                    <div class="profile-menu-user">
                        <img src="zdjecia/profilowe.png" alt="">
                        <span id="profile-name"></span>
                    </div>
                    <hr>
                    <button class="profile-menu-item" id="logout">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        Wyloguj się
                    </button>
                </div>
            </div>
        </header>

        <main class="games-container" id="games-list">
        </main>

        <footer class="bottom-bar">
            <button class="add-game" id="open-add-game">
                <span>⊕</span> Dodaj grę
            </button>
        </footer>

        <!-- DODAWANIE GRY -->
        <div id="add-game-modal" class="modal" hidden>
            <div class="modal-content">
                <h2>Nazwa gry</h2>

                <div class="modal-search">
                    <input type="text" id="game-name" placeholder="Wpisz nazwę gry">
                    <button id="search-steam">🔍</button>
                </div>

                <div id="steam-results"></div>

                <input type="number" id="game-rating" min="1" max="10"
                    placeholder="Twoja ocena (1-10), opcjonalnie">

                <select id="game-genre">
                    <option value="">Wybierz gatunek</option>
                    <option value="Akcja">Akcja</option>
                    <option value="Przygodowe">Przygodowe</option>
                    <option value="RPG">RPG</option>
                    <option value="MMORPG">MMORPG</option>
                    <option value="Soulslike">Soulslike</option>
                    <option value="FPS">Strzelanki (FPS)</option>
                    <option value="TPS">Strzelanki (TPS)</option>
                    <option value="Strategie">Strategie</option>
                    <option value="Symulacje">Symulacje</option>
                    <option value="Wyścigowe">Wyścigowe</option>
                    <option value="Sportowe">Sportowe</option>
                    <option value="Horror">Horror</option>
                </select>

                <select id="game-status">
                    <option value="Do ogrania">Do ogrania</option>
                    <option value="W trakcie">W trakcie</option>
                    <option value="Ukończona">Ukończona</option>
                </select>

                <button id="confirm-add-game">Dodaj grę</button>
                <button id="cancel-add-game">Anuluj</button>
            </div>
        </div>

        <!-- EDYTOWANIE GRY -->
        <div id="edit-game-modal" class="modal" hidden>
            <div class="modal-content">
                <h2>Edytuj grę</h2>

                <label for="edit-game-genre">Gatunek gry:</label>

                <select id="edit-game-genre">
                    <option value="">Brak gatunku</option>
                    <option value="Akcja">Akcja</option>
                    <option value="Przygodowe">Przygodowe</option>
                    <option value="RPG">RPG</option>
                    <option value="MMORPG">MMORPG</option>
                    <option value="Soulslike">Soulslike</option>
                    <option value="FPS">Strzelanki (FPS)</option>
                    <option value="TPS">Strzelanki (TPS)</option>
                    <option value="Strategie">Strategie</option>
                    <option value="Symulacje">Symulacje</option>
                    <option value="Wyścigowe">Wyścigowe</option>
                    <option value="Sportowe">Sportowe</option>
                    <option value="Horror">Horror</option>
                </select>

                <label for="edit-game-status">Status gry:</label>

                <select id="edit-game-status">
                    <option value="Do ogrania">Do ogrania</option>
                    <option value="W trakcie">W trakcie</option>
                    <option value="Ukończona">Ukończona</option>
                </select>

                <button id="confirm-edit-game">Zapisz zmiany</button>
                <button id="cancel-edit-game">Anuluj</button>
            </div>
        </div>

        <!-- USUWANIE GRY -->
        <div id="delete-game-modal" class="modal" hidden>
            <div class="modal-content">
                <h2>Czy na pewno chcesz usunąć tę grę?</h2>

                <button id="confirm-delete-game">Tak</button>
                <button id="cancel-delete-game">Anuluj</button>
            </div>
        </div>

    </div>

    <button id="logout">Wyloguj</button>
</body>

</html>
