
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie</title>
    <link rel="stylesheet" href="styl-logowania.css">
</head>
<script src="logowanie.js" defer></script>
<body>

    <main class="strona">

        

        <section class="panel">

            <div class="formularz">

                <h1>LOGOWANIE</h1>

                <form id="login-form">
                    <p id="blad" style="color: #ff6b6b; font-size: 13px;"></p>
                    <label for="nazwa">Nazwa Użytkownika</label>
                    <input type="text" id="nazwa" name="nazwa">

                    <label for="haslo">Hasło</label>
                    <input type="password" id="haslo" name="haslo">

                    <button type="submit">Zaloguj się</button>
                </form>

                <a href="../frontend/haslo.html" class="odzyskaj">Nie pamiętasz hasła?</a>

            </div>

        </section>

        <footer>
            <p>Nie masz konta?</p>
            <a href="../frontend/rejestracja.html" class="rejestracja">Utwórz konto</a>
        </footer>

    </main>

</body>
</html>
